# ════════════════════════════════════════════════════════
# S1 Mathematical Dynamic Thresholding — 7대 수학 모델 파라미터
# Operation Zero-Hardcoding (2026-07-16)
# ════════════════════════════════════════════════════════

# Model 1 & 2: VIX 스케일링 및 Gap Threshold (adaptive_threshold.py)
adaptive_threshold:
  # Model 1: Gamma-Aware Asymmetric Log VIX Scaling
  # 공식: 1.0 + max(0, log(vix / vix_baseline)) * vix_log_elasticity
  # vix_baseline = 18.0: S&P500 장기 옵션 마켓메이커 감마 플립선
  vix_baseline: 18.0
  vix_log_elasticity: 0.5         # log-linear 탄력성 계수 (0.5 = 완만한 비례)

  # Model 2: Friction-Bound Volatility Gap Threshold 하한선
  # 최소 마찰 비용 (Slippage + Commission) → gap threshold 하한 보장
  min_friction_cost: 0.10         # 단위: % (슬리피지 + 수수료 합산)

  # Model 5: Regime Asymmetry base 편향값 (tanh 비선형 함수로 스케일링됨)
  # 공식: shift = base_shift * math.tanh(regime_strength * math.pi)
  regime_asymmetry:
    bull:
      base_long_shift: -0.08      # 추세 순응: long 진입 완화
      base_short_shift: +0.08     # 추세 역행: short 진입 강화
    caution:
      base_long_shift: 0.00
      base_short_shift: 0.00
    bear:
      base_long_shift: +0.08      # 역추세 억제: long 진입 강화
      base_short_shift: -0.08     # 추세 순응: short 진입 완화
    crash:
      base_long_shift: +0.15      # Crash 시 레버리지 강하게 억제
      base_short_shift: -0.15     # 인버스 진입 대폭 완화

  # Model 6: Kelly Shrinkage Single Stock Threshold
  # 공식: idio_vol = vix_scale * (1 - 1/(1+beta))
  #        single_min = clamp(0.5 + kelly_shrinkage * idio_vol, 0.52, 0.68)
  single_stock:
    kelly_shrinkage: 0.5          # Half-Kelly 축소 계수
    beta_floor: 0.8               # 베타 하한 가정 (저베타 종목 보정)

# Model 3, 4, 7: OFI Sigmoid, Chandelier SL, Variance Ratio (etf_sniper_stream.py)
s1:
  # Model 3: LP Pressure → OFI Z-Score Sigmoid (방안 C 확정)
  # 공식: ofi_z = (lp_pressure - lp_ma) / max(lp_std, 1.0)
  #        ofi_prob = 1 / (1 + exp(-k * ofi_z))
  #        tactic_a_trigger = (ofi_prob < (1 - ofi_trigger_prob))
  ofi_sigmoid_k: 2.0              # 감사 권장안: 5.0 → 2.0 (Z=-1.1σ에서 발동)
  ofi_trigger_prob: 0.90          # 매도 극단 하위 10% 컷

  # Model 4: Chandelier Exit (ATR 기반 동적 손절매)
  # 공식: sl_pct = max(sl_min_pct, atr_5m * sl_atr_multiplier)
  exit:
    sl_atr_multiplier: 2.0        # Chandelier ATR 배수 (기존 exit.s1.atr_sl_multiplier와 별개)
    sl_min_pct: 0.003             # 절대 손절매 하한: 0.3%

  # Model 7: Variance Ratio Test for Tactic B/C
  # 공식: vol_z = (vol_ratio - 1.0) * sqrt(vol_history_window)
  #        tactic_trigger = (vol_z > z_threshold)
  variance_ratio:
    z_threshold: 2.0              # 통계적 유의성 컷 (p≈0.023, 2-sigma)
    vol_history_window: 20        # 단기 분산 추정 윈도우 (일)

  # Sniper 수익/손절 기본 파라미터
  sniper_tp_pct: 0.015            # 기본 목표수익률 1.5%
  tactic_bc_tp_multiplier: 1.5    # Tactic B/C 확장 TP 배수 (하드코딩 1.5 외부화)

  # ── 사전 조건 키: MacroRealtimeRefresher._refresh_s1_derived_stats() 파라미터 ──
  # signal_cache에 주입될 rolling 통계 계산 윈도우
  vix_rolling_window: 20          # vix_ma_20 / vix_std_20 계산 윈도우
  lp_pressure_rolling_window: 20  # lp_pressure_ma / lp_pressure_std 계산 윈도우
  atr_5m_window: 5                # 5분봉 ATR 계산 봉 수 (Wilder 근사)

# Model 2 전역 마찰 비용 (adaptive_threshold 내부와 동일값, 실행 레이어와 공유)
execution:
  min_friction_cost: 0.10         # Slippage + Commission 최소 마찰 비용 (%)

chameleon:
  use_volatility_targeting: false
  use_safe_haven: true
  use_vampire_routing: false
