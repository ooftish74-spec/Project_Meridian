project:
  name: Project Meridian
  version: 2.0.0
  description: 4-Stream 통합 알파 생성 + 자산 관리 시스템
  architecture: 4-Stream (S1:Edge, S2:ML Alpha, S3:Factor, S4:Advisory)
market:
  kr_open: 09:00
  kr_close: '15:30'
  kr_force_close: '15:10'
  premarket_open: 08:00
  aftermarket_close: '20:00'
  timezone: Asia/Seoul
streams:
  s1_edge:
    name: Edge/Directional
    active_start: 08:00
    active_end: '15:10'
    description: 방향성 ETF + 갭/스윙 트레이딩
  s2_ml_alpha:
    name: ML Alpha
    active_start: 09:00
    active_end: '15:10'
    description: 5-앙상블 ML 기반 개별주 알파
    model:
      type: 5-ensemble
      models:
      - GBR
      - XGBoost
      - RandomForest
      - LightGBM
      - CatBoost
      features: 51
      feature_source: data/feature_store/
      model_path: results/models/stock_ranker_ensemble.pkl
      conformal: true
      kelly_fraction: 0.25
  s3_active_macro:
    name: Active Macro / Sector Rotation
    rebalance_day: 1
    description: 5-팩터 기반 섹터/종목 로테이션
    factors:
    - momentum
    - trend
    - mean_reversion
    - volatility
    - quality
  s4_advisory:
    name: Tax-Advisory
    description: ISA/IRP/개인연금 절세계좌 관리
allocator:
  active_streams:
  - S1
  - S2
  - S3
  - S5
allocation:
  s2_upscale_ratio: 0.5
  penalty_ratio: 0.5
portfolio:
  sleeve_a_ratio: 0.6
  trailing_ratio:
    bull: 0.2
    caution: 0.3
    bear: 0.4
  time_decay_base: 0.5
  time_decay_scale: 0.5
  recent_days_window: 7
  calmar_lookback: 60
  calmar_softmax_tau: 1.5
  calmar_realloc_days: 21
  s0_min_alloc: 0.2
  s0_max_alloc: 0.45
  sleeve_b_ratio: 0.30      # [Option C] S0 배분 비율 (0.40→0.30, 잉여→S2)
  s2_max_alloc:   0.30      # [Option C] S2 과집중 방지 상한
  sc_alloc: 0.1
  sc_min_alloc: 0.03
  sc_max_alloc: 0.2
  vol_target_pct: 17.5
  vol_target_window: 20
  vol_scale_min: 0.5
  vol_scale_max: 1.0
risk:
  ewma_lookback: 60
  ewma_init_days: 10
training:
  target_type: max_return
  forward_days: 5
  positive_threshold_pct: 3.0
  rolling_window_days: 730
  retrain_frequency_days: 7
  retrain_cooldown_days: 2
  triggers:
  - regime_change
  - da_failure
  - vix_spike
  - market_extreme
  - drift_detected
regime:
  hmm_n_states: 4
  hmm_state_map_4:
    state_0: bull
    state_1: caution
    state_2: caution
    state_3: momentum_surge
  hmm_state_map_2:
    state_0: bull
    state_1: bear
  allow_momentum_surge: true
  hmm_covariance_type: full
  hmm_n_iter: 100
  hmm_random_state: 42
  crash_vix_vel_warn: 0.3
  crash_vix_vel_alarm: 0.6
  crash_volume_z_threshold: 3.0
  crash_pcr_normal: 0.8
  crash_pcr_extreme: 1.5
  crash_vkospi_normal: 15.0
  crash_vkospi_extreme: 40.0
  crash_radar_w_vix: 0.4
  crash_radar_w_vol: 0.3
  crash_radar_w_fear: 0.3
  crash_radar_warn_threshold: 0.5
  crash_radar_score_penalty: 20.0
  crash_radar_exit_threshold: 0.35
  crash_radar_min_hold_days: 3
  crash_radar_time_decay: true
exit:
  s1:
    take_profit_pct: 0.015
    stop_loss_pct: -0.007
    trailing_stop_pct: null
    max_hold_days: 1
    min_hold_days: 0
    signal_expire_days: 0
    partial_exit: false
    use_atr_stops: true
    atr_sl_multiplier: 1.5
    atr_tp_multiplier: 2.5
    atr_window: 14
  s2:
    take_profit_pct: 0.15
    stop_loss_pct: -0.07
    trailing_stop_pct: -0.1
    trailing_activate_pct: 0.05
    max_hold_days:
      bull: 30
      caution: 20
      bear: 14
      crash: 7
    min_hold_days: 1
    signal_expire_days: 0  # 0=비활성화. 양수 설정 시 해당 일수 후 손익분기 이하 포지션 청산
    expire_profit_keep_pct: 3.0  # signal_expire 후 이 수익률 이상이면 유지
    use_atr_stops: true
    atr_sl_multiplier: 2.0
    atr_tp_multiplier: 3.5
  s3:
    take_profit_pct: 0.2
    stop_loss_pct: -0.08
    trailing_stop_pct: -0.12
    trailing_activate_pct: 0.08
    max_hold_days:
      bull: 90
      caution: 60
      bear: 45
      crash: 21
    min_hold_days: 5
    signal_expire_days: 10
    use_atr_stops: true
    atr_sl_multiplier: 2.5
    atr_tp_multiplier: 4.0
    partial_exit: true
    partial_exit_pct: 0.5
    partial_exit_trigger: 0.12
  s4:
    take_profit_pct: 0.3
    stop_loss_pct: -0.12
    trailing_stop_pct: -0.15
    trailing_activate_pct: 0.1
    max_hold_days:
      bull: 180
      caution: 120
      bear: 90
      crash: 45
    min_hold_days: 10
    signal_expire_days: 30
    partial_exit: true
    partial_exit_pct: 0.3
    partial_exit_trigger: 0.2
    tax_aware: true
    tax_loss_harvest_pct: -0.1
    isa_tax_free_limit: 2000000
    isa_min_hold_years: 3
    turnover_penalty: 0.005
  risk_sensitivity:
    s1: 1.0
    s2: 0.8
    s3: 0.6
    s4: 0.4
execution:
  default_strategy: twap
  n_slices: 5
  min_order_value: 100000
  slippage_bps: 7.5
  commission_bps: 1.5
  modes:
  - shadow
  - mock
  - paper
  - live
  current_mode: live
schedule:
  phases:
  - phase: overnight
    time: 05:15
    description: 야간 인텔리전스 수집
  - phase: collect
    time: 06:00
    description: 10단계 전체 데이터 수집
  - phase: premarket
    time: 07:45
    description: 프리마켓 분석 + 레짐 판정
  - phase: morning
    time: 08:00
    description: Intelligence Cascade
  - phase: market
    time: 09:05
    description: 매매 실행
  - phase: intraday
    time: 09:30
    description: 장중 실시간 모니터링
  - phase: closing
    time: '15:10'
    description: 포지션 청산 + PnL
  - phase: aftermarket
    time: '15:35'
    description: 애프터마켓 분석
  - phase: krx_refresh
    time: '16:10'
    description: KRX 확정 데이터
  - phase: collect_flow
    time: '16:30'
    description: 투자자 수급 수집
  - phase: evening_data
    time: '17:00'
    description: US 가격 + 저녁 데이터
  - phase: collect_dart
    time: '19:00'
    description: DART 공시 수집
  - phase: evening
    time: '20:00'
    description: 자가학습 + 리포트
  - phase: us_market
    time: '22:35'
    description: 미국 시장 트레이딩
  - phase: weekly_retrain
    time: 토 02:00
    description: 주간 ML 재학습
  - phase: weekly_validate
    time: 토 03:00
    description: 주간 검증
data:
  feature_store: data/feature_store/
  model_cache: data/model_cache/
  historical_10y: data/historical_10y/
  minute_bars: data/minute_bars/
  financials: data/financials_history/
  earnings: data/earnings_database/
  raw: data/raw/
s5_overnight:
  enabled: true
  max_allocation_pct: 0.4
  overnight_reversion_threshold: 1.0
  tp_pct: 1.0
  sl_pct: -1.5
ml:
  excluded_features: []
  cv_method: purged_ts_split
  cv_n_splits: 5
  cv_purge_days: 5
risk_mc:
  mc_enabled: true
  mc_n_simulations: 10000
  mc_horizon_days: 1
  mc_seed: null
risk_factor:
  factor_lookback_days: 120
  factor_list:
