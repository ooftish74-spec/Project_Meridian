  fill_fallback: market
  fill_check_interval_sec: 5
telegram:
  enabled: true
  bot_token: ''
  chat_id: ''
  alert_levels:
  - CRITICAL
  - WARNING
  - INFO
  daily_summary: true
  kill_switch_alert: true
  trade_alert: true
intraday:
