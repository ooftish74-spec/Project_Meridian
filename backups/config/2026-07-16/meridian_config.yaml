  kospi_surge_pct: 2.0
  vix_spike_pct: 3.0
  freeze_minutes: 30
hedge:
  instruments: null
websocket:
  enabled: true
  reconnect_base_sec: 1.0
  reconnect_max_sec: 60.0
  mock_interval_sec: 1.0
  max_subscriptions: 40
  channels:
  - price
  - orderbook
  - notice
train:
  embargo_days: 5
  val_ratio: 0.2
  wf_acc_retrain_threshold: 0.55
s5:
  enabled: true
crash:
  stress_vix_threshold: 30
  stress_vix_max_score: 40
  stress_vix_scale: 2
  stress_vkospi_threshold: 25
  stress_vkospi_max_score: 20
  stress_vkospi_scale: 2
