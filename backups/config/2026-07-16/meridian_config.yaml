    us_sp500_moderate: -0.02
    us_sp500_severe: -0.04
    us_nasdaq_moderate: -0.025
    us_nasdaq_severe: -0.05
    vix_moderate: 25.0
    vix_severe: 35.0
    futures_moderate: -0.015
    futures_severe: -0.03
